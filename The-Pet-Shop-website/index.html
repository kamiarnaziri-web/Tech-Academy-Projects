<!-- 1. Navigation Tag (<nav>) -->
<header>
    <h1>My One-Page Website</h1>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<!-- 2. Home Page Section with Heading and Paragraph tags -->
<section id="home">
    <h2>Home Section</h2>
    <p>Welcome to my one-page website assignment. This site includes all the required HTML tags and elements for proper evaluation.</p>
</section>

<!-- 3. Image Tag (<img>) with an alt attribute -->
<section id="about">
    <h2>Image Section</h2>
    <img src="https://via.placeholder.com/600x300" alt="A placeholder sample image for the website" style="max-width:100%; height:auto;">
</section>

<!-- 4. Iframe Tag (<iframe>) -->
<section>
    <h2>Frame Section</h2>
    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=51.389%2C35.689%2C51.409%2C35.709&amp;layer=mapnik" width="100%" height="250" style="border:0;" title="Map"></iframe>
</section>

<!-- 5. Form Tag (<form>) with input elements inside -->
<section id="contact">
    <h2>Contact Form</h2>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name">
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email">
        
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Enter your message"></textarea>
        
        <button type="submit" style="padding: 10px 15px; background: #333; color: #fff; border: none; cursor: pointer;">Submit</button>
    </form>
</section>

<!-- 6. Footer Tag (<footer>) -->
<footer>
    <p>&copy; 2026 All Rights Reserved.</p>
</footer>
