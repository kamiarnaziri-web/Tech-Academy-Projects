<meta name="description" content="Welcome to The Pet Shop - Your trusted place for pet supplies and information.">

<!-- Google Fonts link -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Roboto', sans-serif;
        text-align: center;
        margin-top: 50px;
        background-color: #f9f9f9;
        color: #333;
    }

    .image-box {
        position: relative;
        width: 300px;
        margin: 20px auto;
    }

    .image-box img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
        transition: transform 0.3s ease;
    }

    .image-box img:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    blockquote {
        font-style: italic;
        margin: 20px auto;
        padding: 10px 20px;
        max-width: 500px;
        color: #555;
        border-left: 4px solid #4CAF50;
        background: #fff;
        text-align: left;
    }
</style>
<!-- Blockquote requested by the instructor -->
<blockquote>
    <p>"Until one has loved an animal, a part of one's soul remains unawakened."</p>
</blockquote>

<div class="image-box">
    <img src="https://picsum.photos/300/200" alt="Sample Image">
</div>
